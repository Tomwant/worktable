<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库报告 · 自测题答案折叠 原型</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 22px 22px 40px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #14171c; color: #e9ede8;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  .hd { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .hd h1 { font-size: 17px; margin: 0 0 6px; letter-spacing: .3px; }
  .hd p { margin: 0; font-size: 13px; line-height: 1.7; color: #a9b5ae; max-width: 720px; }
  .hd p b { color: #e9ede8; font-weight: 600; }
  .hd code {
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
    padding: 1px 6px; border-radius: 6px; color: #d8c9a4;
  }

  .tabs { display: flex; gap: 8px; margin: 0 0 12px; }
  .tabs button {
    font: inherit; font-size: 13px; cursor: pointer;
    padding: 7px 16px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.05); color: #b6c1ba;
    transition: background .16s, color .16s, border-color .16s;
  }
  .tabs button:hover { background: rgba(255,255,255,.1); color: #e9ede8; }
  .tabs button.on { background: #c4a7e7; border-color: #c4a7e7; color: #241a33; font-weight: 600; }

  .stage {
    border-radius: 26px; padding: 14px;
    background: linear-gradient(160deg, #221d2e 0%, #1a1a24 55%, #16201d 100%);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .modal { border-radius: 18px; overflow: hidden; background: rgba(28,26,36,.72); border: 1px solid rgba(255,255,255,.09); }
  .modal-hd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 18px; font-size: 13px; font-weight: 600; color: #e9ede8;
    border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .modal-hd .x { font-size: 16px; color: #9aa5a0; cursor: default; }
  .modal-bd { padding: 4px 12px 10px; }
  iframe { display: block; width: 100%; height: 470px; border: 0; border-radius: 14px; background: #f5f7f6; }
  .modal-ft {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 14px; font-size: 12.5px;
  }
  .modal-ft .lnk { color: #a9b5ae; text-decoration: none; border-bottom: 1px dashed rgba(255,255,255,.22); }
  .modal-ft .btn {
    padding: 6px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.05); color: #d6dfd9; font-size: 12.5px;
  }
  .tip {
    margin-top: 12px; font-size: 12.5px; line-height: 1.75; color: #a9b5ae;
    border-left: 3px solid #c4a7e7; padding: 2px 0 2px 12px;
  }
  .tip b { color: #e9ede8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div>
      <h1>知识库 · 原报告「今日自测题」改造原型</h1>
      <p>
        那个「做完看答案」<b>不是按钮</b>——它只是报告 HTML 里的一个金色小标签（截图里的蓝底是你拖动选中了文字）。
        答案本来就<b>全部展开着</b>，所以既不用点、也点不了。<br>
        改后：答案默认收起，点题目那一行展开。用原生 <code>&lt;details&gt;</code> 实现，<b>不依赖 JS</b>，
        所以预览 iframe 保持 <code>sandbox=""</code> 也能点开，安全性一点不放松。
      </p>
    </div>
  </div>

  <div class="tabs">
    <button id="tabA" class="on" data-v="after">改造后（默认收起）</button>
    <button id="tabB" data-v="before">改造前（现在这样）</button>
  </div>

  <div class="stage">
    <div class="modal">
      <div class="modal-hd"><span>第2期 · 收入与成本</span><span class="x">✕</span></div>
      <div class="modal-bd"><iframe id="fr" sandbox="" referrerpolicy="no-referrer"></iframe></div>
      <div class="modal-ft">
        <a class="lnk" href="javascript:void 0">在新窗口打开</a>
        <span class="btn">关闭</span>
      </div>
    </div>
  </div>

  <div class="tip">
    <b>顺手验证一件事：</b>下面这个 iframe 就是知识库预览用的 <code>sandbox=""</code>（禁用一切脚本）。
    点题目展开是纯 HTML 行为，所以在这里点得动 = 改到真页面里也点得动。
  </div>
</div>

<script>
// 报告本体样式（与定时任务产出的报告保持一致）
const BASE_CSS = `
  :root{
    --green:#2f6b5e; --green-soft:#e7f0ed; --gold:#c9a961; --gold-soft:#f7f1e4;
    --ink:#1f2a26; --muted:#5f6b66; --line:#e3e8e5; --bg:#f5f7f6; --card:#fff;
    --r:16px; --shadow:0 6px 24px rgba(47,107,94,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.75; padding:24px 16px 40px;
  }
  .wrap{max-width:820px;margin:0 auto;}
  .card{background:var(--card);border-radius:var(--r);padding:24px 26px;box-shadow:var(--shadow);margin-bottom:16px;}
  .card-title{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;margin-bottom:16px;letter-spacing:.5px;}
  .card-title .no{
    width:22px;height:22px;border-radius:7px;background:var(--green);color:#fff;
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .tag{
    margin-left:auto;font-size:12px;font-weight:600;color:#8a6f2e;
    background:var(--gold-soft);border-radius:999px;padding:3px 11px;
  }
  .lead{font-size:14px;color:var(--muted);margin-bottom:14px;}
  .muted{font-size:13.5px;color:var(--muted);margin-top:16px;}

  /* ---- 改造后：原生 details 折叠 ---- */
  details.quiz{
    border:1px solid var(--line);border-radius:12px;background:#fff;
    margin-bottom:12px;overflow:hidden;transition:border-color .18s,box-shadow .18s;
  }
  details.quiz:hover{border-color:#cfdcd6;box-shadow:0 3px 12px rgba(47,107,94,.07);}
  details.quiz[open]{border-color:#cfe0d9;box-shadow:0 3px 14px rgba(47,107,94,.08);}
  details.quiz summary{
    display:flex;align-items:flex-start;gap:12px;
    padding:14px 16px;cursor:pointer;list-style:none;user-select:none;
  }
  details.quiz summary::-webkit-details-marker{display:none;}
  details.quiz summary::marker{content:"";}
  .q{flex:1 1 auto;font-size:15px;font-weight:600;color:var(--ink);line-height:1.6;}
  .peek{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
    font-size:12.5px;font-weight:600;color:#8a6f2e;
    background:var(--gold-soft);border-radius:999px;padding:3px 11px 3px 9px;
    transition:background .18s,color .18s;margin-top:1px;
  }
  .peek .arw{font-size:10px;line-height:1;transition:transform .2s;}
  details.quiz:hover .peek{background:#f2e8d2;}
  details.quiz[open] .peek{background:var(--green-soft);color:#2a5b50;}
  details.quiz[open] .peek .arw{transform:rotate(180deg);}
  .peek .t-on{display:inline;}
  .peek .t-off{display:none;}
  details.quiz[open] .peek .t-on{display:none;}
  details.quiz[open] .peek .t-off{display:inline;}
  .ans{
    border-top:1px dashed var(--line);
    padding:12px 16px 14px;background:#fbfcfb;
    font-size:14.5px;line-height:1.75;
    animation:fade .2s ease-out;
  }
  .ans b{color:var(--green);}
  .ans span{color:var(--muted);font-size:13.5px;}
  @keyframes fade{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:none;}}

  /* ---- 改造前：答案直出 ---- */
  .quiz-old{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
  .q-old{font-size:15px;font-weight:600;line-height:1.6;}
  .a-old{margin-top:8px;font-size:14.5px;color:var(--ink);}
  .a-old b{color:var(--green);}
  .a-old span{color:var(--muted);font-size:13.5px;}
`;

const BEFORE_BODY = `
  <div class="card">
    <div class="card-title"><span class="no">5</span>今日自测题<span class="tag">做完看答案</span></div>
    <div class="quiz-old">
      <div class="q-old">Q1：门店本月收银流水 100,000 元，退款 1,000 元，折扣 4,000 元，营业收入是多少？</div>
      <div class="a-old">A1：95,000 元。<span>（100,000 − 1,000 − 4,000）</span></div>
    </div>
    <div class="quiz-old">
      <div class="q-old">Q2：期初库存 5,000 元，本期进货 30,000 元，期末库存 7,000 元，本月已售商品成本是多少？</div>
      <div class="a-old">A2：28,000 元。<span>（5,000 + 30,000 − 7,000，不是 30,000）</span></div>
    </div>
    <div class="quiz-old">
      <div class="q-old">Q3（判断）：顾客办了 2,000 元充值卡，本月只消费了 500 元，本月收入应记多少？为什么？</div>
      <div class="a-old">A3：记 500 元收入。<span>其余 1,500 元是"预收账款"（负债），等顾客真正消费、服务发生时再确认收入，不能一次全算进本月收入。</span></div>
    </div>
    <p class="muted">三题都答对，说明"收入与成本"的口径已经立住了。下期我们顺着利润往下拆 —— 聊聊「净利率」，看看毛利到净利中间到底被什么吃掉了。</p>
  </div>
`;

const AFTER_BODY = `
  <div class="card">
    <div class="card-title"><span class="no">5</span>今日自测题</div>
    <p class="lead">先自己算一遍，再点答案对一下。</p>

    <details class="quiz">
      <summary>
        <span class="q">Q1：门店本月收银流水 100,000 元，退款 1,000 元，折扣 4,000 元，营业收入是多少？</span>
        <span class="peek"><span class="t-on">看答案</span><span class="t-off">收起</span><span class="arw">▾</span></span>
      </summary>
      <div class="ans">A1：<b>95,000 元</b>。<span>（100,000 − 1,000 − 4,000）</span></div>
    </details>

    <details class="quiz">
      <summary>
        <span class="q">Q2：期初库存 5,000 元，本期进货 30,000 元，期末库存 7,000 元，本月已售商品成本是多少？</span>
        <span class="peek"><span class="t-on">看答案</span><span class="t-off">收起</span><span class="arw">▾</span></span>
      </summary>
      <div class="ans">A2：<b>28,000 元</b>。<span>（5,000 + 30,000 − 7,000，不是 30,000）</span></div>
    </details>

    <details class="quiz">
      <summary>
        <span class="q">Q3（判断）：顾客办了 2,000 元充值卡，本月只消费了 500 元，本月收入应记多少？为什么？</span>
        <span class="peek"><span class="t-on">看答案</span><span class="t-off">收起</span><span class="arw">▾</span></span>
      </summary>
      <div class="ans">A3：<b>记 500 元收入</b>。<span>其余 1,500 元是"预收账款"（负债），等顾客真正消费、服务发生时再确认收入，不能一次全算进本月收入。</span></div>
    </details>

    <p class="muted">三题都答对，说明"收入与成本"的口径已经立住了。下期我们顺着利润往下拆 —— 聊聊「净利率」，看看毛利到净利中间到底被什么吃掉了。</p>
  </div>
`;

const page = body => `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>${BASE_CSS}</style></head><body><div class="wrap">${body}</div></body></html>`;

const fr = document.getElementById('fr');
const render = v => { fr.srcdoc = v === 'after' ? page(AFTER_BODY) : page(BEFORE_BODY); };

document.querySelectorAll('.tabs button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    render(b.dataset.v);
  });
});

render('after');
</script>
</body>
</html>
