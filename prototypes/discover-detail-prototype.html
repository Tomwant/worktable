海边有个渔村，村民靠打鱼为生。村长（相当于中央银行）发现最近生意冷清，就想了个办法：把借钱的利息降到几乎为零，鼓励大家借钱买船、扩产。

村长再怎么降息，利率已经接近零，还是没人动。这就是**流动性陷阱**。

## 本质是什么

利率是"放弃持有现金的补偿"。当所有人一致认为未来会更差、资产还会跌，任何正的利率都不足以让他们放弃现金——他们宁愿持有流动性本身。

此时货币政策**失效**：降息没用，因为钱进不了实体；央行印的钱只是堆在银行体系里，变成超额准备金。

1. 名义利率接近零下限（或实际利率为负）

轮盘连开 10 次红。旁边的人说："下一把肯定是黑了，红开太多了。"

  dayMode = dayMode === 'same' ? 'global' : 'same'
  const b = document.getElementById('dayMode')
  b.textContent = dayMode === 'same' ? '第 N 天 · 同类累计' : '第 N 天 · 全部累计'
  render()
}

/* ============ 极简 Markdown 渲染 ============ */
function mdToHtml(src) {
  const lines = String(src).split('\n')
  let html = '', list = [], table = []
  const flushList = () => { if (list.length) { html += '<ul>' + list.map(x => '<li>' + inline(x) + '</li>').join('') + '</ul>'; list = [] } }
  const flushTable = () => {
    if (!table.length) return
    const rows = table.filter(r => !/^\|?[\s:-]+\|/.test(r))
    const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim())
    let t = '<table><thead><tr>' + cells(rows[0]).map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>'
    for (let i = 1; i < rows.length; i++) t += '<tr>' + cells(rows[i]).map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>'
    html += t + '</tbody></table>'; table = []
  }
  const inline = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
  for (const raw of lines) {
    const line = raw.trimEnd()
    if (/^\|.*\|$/.test(line)) { flushList(); table.push(line); continue }
    flushTable()
    if (!line.trim()) { flushList(); continue }
    if (/^###\s+/.test(line)) { flushList(); html += '<h2>' + inline(line.replace(/^###\s+/, '')) + '</h2>'; continue }
    if (/^##\s+/.test(line)) { flushList(); html += '<h2>' + inline(line.replace(/^##\s+/, '')) + '</h2>'; continue }
    if (/^#\s+/.test(line)) { flushList(); html += '<h2>' + inline(line.replace(/^#\s+/, '')) + '</h2>'; continue }
    if (/^[-*]\s+/.test(line)) { list.push(line.replace(/^[-*]\s+/, '')); continue }
    if (/^\d+\.\s+/.test(line)) { list.push(line.replace(/^\d+\.\s+/, '')); continue }
    if (/^>\s?/.test(line)) { flushList(); html += '<blockquote>' + inline(line.replace(/^>\s?/, '')) + '</blockquote>'; continue }
    if (/^---$/.test(line)) { flushList(); html += '<hr>'; continue }
    flushList(); html += '<p>' + inline(line) + '</p>'
  }
  flushList(); flushTable()
  return html
}

/* ============ 渲染列表 ============ */
function render() {
  document.getElementById('list').innerHTML = items.map((it, i) => {
    const d = dayLabel(it)
    const plain = it.content.replace(/<[^>]+>/g, ' ').replace(/[#*|>-]/g, ' ').replace(/\s+/g, ' ').trim()
    return `<article class="card" onclick="openModal(${i})">
      <div class="card-head">
        <span class="day"><b>${d.n}</b>天</span>
        <h3>${it.title}</h3>
        <div class="card-actions">
          <span class="badge-auto">⟳ 自动收录</span>
          <span class="date">${it.date}</span>
        </div>
      </div>
      <div class="meta-row">
        <span>${it.source}</span>
        <span class="type">${it.type === 'html' ? 'HTML' : 'Markdown'}</span>
        <span>· ${plain.length} 字</span>
      </div>
      <p class="summary">${plain.slice(0, 110)}…</p>
      <div class="tags">${it.tags.map(t => `<span class="chip">#${t}</span>`).join('')}</div>
      <button class="read" onclick="event.stopPropagation();openModal(${i})">阅读全文 →</button>
    </article>`
  }).join('')
}

/* ============ 弹窗 ============ */
function openModal(i) {
  const it = items[i], d = dayLabel(it)
  document.getElementById('mDay').innerHTML = `<b>${d.n}</b>天`
  document.getElementById('mTitle').textContent = it.title
  document.getElementById('mMeta').innerHTML =
    `<span class="badge-auto">⟳ 自动收录</span>` +
    `<span>${it.source}</span><span>·</span><span>${it.date}</span>` +
    `<span class="type">${it.type === 'html' ? 'HTML 页面' : 'Markdown'}</span>` +
    it.tags.map(t => `<span class="chip">#${t}</span>`).join('')
  const body = document.getElementById('mBody')
  if (it.type === 'html') {
    body.innerHTML = `<iframe class="html-frame" sandbox srcdoc="${it.content.replace(/"/g, '&quot;')}"></iframe>`
  } else {
    body.innerHTML = `<div class="md">${mdToHtml(it.content)}</div>`
  }
  body.scrollTop = 0
  document.getElementById('mask').classList.add('show')
}
function closeModal() { document.getElementById('mask').classList.remove('show') }

/* ============ 主题 ============ */
function toggleTheme() {
  const h = document.documentElement
  const dark = h.getAttribute('data-theme') === 'dark'
  h.setAttribute('data-theme', dark ? 'light' : 'dark')
  document.querySelectorAll('.tbtn').forEach(b => { if (b.textContent.includes('深色') || b.textContent.includes('浅色')) b.textContent = dark ? '◐ 深色' : '◑ 浅色' })
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal() })
render()
</script>
</body>
