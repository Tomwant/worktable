name: Deploy demo to GitHub Pages

# 只构建、不碰数据库：
# public/demo/bundle.json 是本地导出的数据快照（npm run export:demo），已随仓库提交，
# 所以云端不需要 MySQL，也不需要后端。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 桌面端打包用的 electron 二进制在 CI 里没用，跳过下载能省 100MB+ 和一两分钟
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建演示版（VITE_DEMO=1）
        run: npm run build:demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
