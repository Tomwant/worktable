<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>object-position 定标</title>
<style>
body{margin:0;padding:20px;font-family:'Microsoft YaHei',sans-serif;background:#fff;color:#222}
h3{font-size:13px;margin:16px 0 8px;font-weight:700}
.row{display:flex;gap:10px;align-items:flex-end;margin-bottom:6px}
.cell{text-align:center}
.av{width:96px;height:96px;border-radius:50%;overflow:hidden;background:#eee;
    border:1px solid #ddd;display:block}
.av img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center 50%}
.lbl{font-size:10px;color:#666;margin-top:3px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEYS=[
  ['tuozai','q01-tuozai.jpg',    1.36],
  ['heart','q02-heart.png',      1.50],
  ['window','q03-window.jpg',    1.25],
  ['window2','q04-window2.jpg',  1.29],
  ['cloud','q05-cloud.png',      1.80, 40],
  ['baoxiong','q06-baoxiong.png',1.22],
]
const XS=[50,60,70,80,90,100,110,120]
const YS=[0,20,40,60,80,100]
const base='../src/assets/yunxiao/official/'
let html=''
for(const [k,file,scale,oy] of KEYS){
  html+=`<h3>${k} · ${file} · scale ${scale}</h3><div class="row">`
  if(oy!==undefined){          // 竖图：固定 x=50%，扫 y
    for(const y of YS){
      html+=`<div class="cell"><span class="av"><img src="${base}${file}" style="object-position:50% ${y}%;transform:scale(${scale});transform-origin:center 50%"></span><div class="lbl">y ${y}%</div></div>`
    }
  }else{                       // 横图：固定 y=50%，扫 x
    for(const x of XS){
      html+=`<div class="cell"><span class="av"><img src="${base}${file}" style="object-position:${x}% 50%;transform:scale(${scale});transform-origin:center 50%"></span><div class="lbl">x ${x}%</div></div>`
    }
  }
  html+='</div>'
}
document.getElementById('app').innerHTML=html
</script>
</body>
</html>
